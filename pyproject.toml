[project]
name = "dota"
version = "0.1.0"
description = "DotA match tracker using OpenDota API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "colorlog>=6.10.1",
    "discord.py>=2.3.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
]

[project.scripts]
dota = "dota.__main__:main"
dota-bot = "dota.bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dota"]
